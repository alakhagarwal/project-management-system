spring.application.name=project-management-system
spring.main.allow-circular-references=true

spring.datasource.url=jdbc:mysql://localhost:3306/project_management_system
spring.datasource.username= root
spring.datasource.password= Alakh@2004

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

# ===============================
# JWT
# ===============================
# NOTE: this must be Base64-encoded and long enough for HS256 (>= 256 bits).
# For production, move to environment variables / secrets manager.
jwt.secret.key=ZHVtbXktZGV2LXNlY3JldC1rZXktMzItYnl0ZXMtbWluaW11bQ==
jwt.expiration.minutes=15

# ===============================
# LOGGING
# ===============================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FILE UPLOAD
# ===============================
# Max file size (default is 1MB)
spring.servlet.multipart.max-file-size=100MB
# Max request size (for multiple files or large requests)
spring.servlet.multipart.max-request-size=100MB
# Enable multipart uploads
spring.servlet.multipart.enabled=true

# ===============================
# AWS S3
# ===============================
aws.accessKeyId=${AWS_ACCESS_KEY_ID}
aws.secretKey=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION:ap-south-1}
aws.bucket.name=${S3_BUCKET_NAME:alakh-pms-1}
